<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 — HanaSpace</title>
<style>
    :root { --accent: #6a4cff; --ink: #14121f; --muted: #6f6b80; --line: rgba(20,18,31,.09); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh; display: grid; place-items: center; padding: 32px;
        font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink); background: #fbfaff;
    }
    .box { width: min(440px, 100%); text-align: center; }
    .code {
        font-size: 76px; font-weight: 800; letter-spacing: -3px; line-height: 1;
        background: linear-gradient(120deg, #6a4cff, #3b82f6);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 17px; font-weight: 650; margin: 18px 0 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.8; }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
    a {
        font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 18px; border-radius: 10px;
        transition: .2s ease;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: #5a3df0; }
    .ghost { color: var(--ink); border: 1px solid var(--line); background: #fff; }
    .ghost:hover { border-color: rgba(20,18,31,.18); }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 26px; text-decoration: none; color: var(--ink); }
    .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
</style>
</head>
<body>
    <div class="box">
        <a class="brand" href="/"><span class="mark">H</span>HanaSpace</a>
        <div class="code">404</div>
        <h1>这个页面不存在</h1>
        <p>链接可能拼错了，或者页面已经被移动。</p>
        <div class="actions">
            <a class="primary" href="/">回到首页</a>
            <a class="ghost" href="/#download">前往下载</a>
        </div>
    </div>
</body>
</html>
