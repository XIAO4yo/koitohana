<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · HanaSpace</title>
<style>
    :root { --primary:#9b72f2; --primary-deep:#7c4dff; --text:#2c2440; --text-sub:#6d6786; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #f8f5ff 0%, #eef6ff 45%, #fdf4fb 100%);
        padding: 24px;
    }
    .card {
        width: min(520px, 100%);
        text-align: center;
        padding: 52px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 24px 60px rgba(97, 70, 160, 0.16);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
    }
    .code {
        font-size: clamp(4rem, 14vw, 6.5rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(120deg, var(--primary), #3b82f6 60%, #5ee7f0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -2px;
    }
    h1 { font-size: 1.2rem; margin: 18px 0 10px; }
    p { color: var(--text-sub); font-size: 0.92rem; line-height: 1.8; }
    .actions { display: flex; gap: 12px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 11px 24px; border-radius: 13px; text-decoration: none;
        font-weight: 700; font-size: 0.9rem; transition: 0.25s ease;
    }
    .btn-main { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-deep)); box-shadow: 0 12px 28px rgba(124, 77, 255, 0.3); }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(124, 77, 255, 0.4); }
    .btn-ghost { color: var(--text); background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(155, 114, 242, 0.3); }
    .btn-ghost:hover { background: #fff; transform: translateY(-2px); }
    .cat { font-size: 2.4rem; margin-bottom: 6px; }
    @media (prefers-color-scheme: dark) {
        :root { --text: #ece9f7; --text-sub: #b3aecb; }
        body { background: linear-gradient(160deg, #171128 0%, #101a2b 50%, #1d1020 100%); }
        .card { background: rgba(32, 26, 48, 0.6); border-color: rgba(255, 255, 255, 0.12); }
        .btn-ghost { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    }
</style>
</head>
<body>
    <div class="card">
        <div class="cat">🐱</div>
        <div class="code">404</div>
        <h1>这个页面不存在</h1>
        <p>可能是链接拼错了，或者它已经被搬家了。<br>回首页看看吧。</p>
        <div class="actions">
            <a class="btn btn-main" href="/">回首页</a>
            <a class="btn btn-ghost" href="/#download">去下载</a>
        </div>
    </div>
</body>
</html>
